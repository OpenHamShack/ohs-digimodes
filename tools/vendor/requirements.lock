# The shared OpenHamShack libraries Digital Modes pins (REPO-LAYOUT 4):
# exact versions and hashes, installed only from this folder by
# tools/vendor/install.py (the image, a development venv, the desktop stage).
#
# shack-client, shack-bandplan, shack-pad and shack-desktop were the wheel
# files OpenHamShack Flex and WB also pinned, byte-identical, before the
# family rename of 21/10/2026 (git filter-repo rewrote the old product
# name throughout ohs-libs' source, which changed their built bytes too -
# builds are not byte-reproducible across a source change any more than
# across a rebuild). Rebuilt from ohs-libs rename/fixup with its
# own tools/build.sh; whoever rebuilds Flex and WB's pins needs this same
# ohs-libs revision for the four to match again.
#
# ohs-ohsdigi is the one decoder (D9, BETA-PLAN decision 3): 0.2.0, which
# adds JS8 and Q65 to FT8/FT4 (this app still offers FT8/FT4 only), built in
# ~/openhamshack-nb (rust/ohsdigi, tools/build-wheels.sh, at be8c102) and
# copied from ~/build/ohsdigi-wheels; its SHA256SUMS list the same hashes. The
# macOS wheel is not carried: there is no Mac form of this app for the beta.
# shack-i18n is the string check's wheel (tools/i18n.py) and is not installed.
